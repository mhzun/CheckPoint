services:
  checkpoint-auth:
    build:
      context: .
      dockerfile: Dockerfile
    image: checkpoint-auth:1.3.0
    container_name: checkpoint-auth
    restart: unless-stopped
    ports:
      # 仅绑定本机回环，对外由反向代理（HTTPS）暴露
      - "127.0.0.1:8080:8000"
    volumes:
      - ./data:/data
      # TLS 证书（可选）：目录下有 cert.pem + key.pem 时容器自动以 HTTPS 监听
      - ./certs:/certs:ro
    environment:
      # 必填：不设置时 compose 拒绝启动；缺失 ADMIN_KEY 容器内管理员接口一律 403
      ADMIN_KEY: ${ADMIN_KEY:?请先设置环境变量 ADMIN_KEY}
      # 响应签名私钥（PKCS#8 DER 的 base64 单行）；未设置时响应不签名，
      # 新版客户端将拒绝所有 code=0 响应 —— 生产必须配置
      SIGN_PRIVATE_KEY: ${SIGN_PRIVATE_KEY:-}
      DB_PATH: /data/checkpoint.db
      # 位于可信反向代理之后时设为 1，才会采信 X-Forwarded-For 的最右侧地址
      # （uvicorn 层代理头处理已用 --no-proxy-headers 彻底关闭，见 entrypoint.sh）
      TRUST_PROXY: ${TRUST_PROXY:-0}
      # token 滑动有效期（天，自最后一次使用起算），默认 30
      TOKEN_TTL_DAYS: ${TOKEN_TTL_DAYS:-30}
      # v1.3.0 业务开关
      REGISTER_ENABLED: ${REGISTER_ENABLED:-1}
      ADMIN_ALLOW_IPS: ${ADMIN_ALLOW_IPS:-}
      MIN_CLIENT_VERSION: ${MIN_CLIENT_VERSION:-}
      REBIND_GRACE_HOURS: ${REBIND_GRACE_HOURS:-24}
    # ---- 容器加固 ----
    user: "10001:10001"          # 非 root 运行
    read_only: true              # 根文件系统只读，仅 /data（挂载）与 /tmp（tmpfs）可写
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL                      # 丢弃全部 Linux capabilities
    pids_limit: 128              # 进程数上限（防 fork 炸弹）
    init: true                   # tini 作 PID 1，正确回收僵尸进程/转发信号
    mem_limit: 256m
    memswap_limit: 256m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # TCP 探活 + 宽容重试（v1.2.0：防御连接洪水导致的探针连坐误判）
      test:
        - CMD
        - python
        - -c
        - "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=3).close()"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
