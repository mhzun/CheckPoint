# 内网联调覆盖文件（仅用于同一内网中的客户端联调）
#
# 作用：把容器端口从 127.0.0.1:8080 改为对内网发布 8080。
# 说明：
#   1) 基础文件 docker-compose.yml 保持不变，生产环境不应使用本文件；
#   2) 生产必须由 HTTPS 反向代理对外暴露，并设置 TRUST_PROXY=1；
#   3) 明文 HTTP 仅限受信任内网，token 与卡密在链路上不加密。
#
# 启用：docker compose up -d   （compose 会自动读取本文件）
# 禁用：删除本文件后 docker compose up -d --force-recreate
services:
  checkpoint-auth:
    # !override 表示整体替换基础文件里的 ports，而不是追加（避免与 127.0.0.1 绑定冲突）
    ports: !override
      - "8080:8000"